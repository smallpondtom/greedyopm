[project]
authors = [{name = "smallpondtom", email = "tkoike45@gmail.com"}]
dependencies = []
name = "greedyopm"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
greedyopm = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
jax = ">=0.9.1,<0.10"
numpy = ">=2.4.3,<3"
absl-py = ">=2.4.0,<3"
pytest = ">=9.0.2,<10"
matplotlib = ">=3.10.8,<4"

[dependency-groups]
test = ["pytest"]
