[project]
authors = [{name = "smallpondtom", email = "tkoike45@gmail.com"}]
dependencies = []
name = "greedyopm"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
greedyopm = { path = ".", editable = true }
# CPN-S baseline (experiments/third_party/CPN_MOR) depends on tensap (PyPI only)
tensap = ">=1.8"

[tool.pixi.tasks]

[tool.pixi.dependencies]
jax = ">=0.9.1,<0.10"
numpy = ">=2.4.3,<3"
absl-py = ">=2.4.0,<3"
pytest = ">=9.0.2,<10"
matplotlib = ">=3.10.8,<4"
jupyter = ">=1.1.1,<2"
# CPN-S baseline requirements (CPN_MOR/requirements.txt): joblib, PyYAML,
# networkx, scikit-learn (matplotlib already above)
joblib = ">=1.4"
pyyaml = ">=6"
networkx = ">=3"
scikit-learn = ">=1.5"

[dependency-groups]
test = ["pytest"]
